<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <title>Non-metal Elements</title>
    <style>
        :root {
            --bg: #e9f1ee;
            --surface: #ffffff;
            --ink: #12262b;
            --muted: #4d6468;
            --line: #bfd2cd;
            --accent: #0b6e69;
            --accent-ink: #ffffff;
            --tile: #f4c04e;
            --tile-ink: #2a1d00;
            --focus: #b4380f;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e1c1f;
                --surface: #152a2e;
                --ink: #e6f1ee;
                --muted: #9bb4b0;
                --line: #2b4549;
                --accent: #5fd0c6;
                --accent-ink: #072321;
                --focus: #ff9a73;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 400 1.0625rem/1.6 "IBM Plex Sans", system-ui, sans-serif;
        }
        main { max-width: 40rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
        header { display: flex; gap: 1.5rem; align-items: center; margin-bottom: 2.5rem; }
        .tile {
            flex: none;
            width: 7.5rem;
            aspect-ratio: 1;
            background: var(--tile);
            color: var(--tile-ink);
            border-radius: 0.5rem;
            padding: 0.6rem 0.75rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-family: "Bricolage Grotesque", sans-serif;
        }
        .tile .num { font-size: 0.95rem; font-weight: 500; }
        .tile .sym { font-size: 3.4rem; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
        .tile .name { font-size: 0.85rem; font-weight: 500; }
        h1 {
            margin: 0 0 0.25rem;
            font: 700 clamp(2rem, 6vw, 2.9rem)/1.05 "Bricolage Grotesque", sans-serif;
            letter-spacing: -0.02em;
        }
        header p { margin: 0; color: var(--muted); }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 0.5rem;
            padding: 1.5rem;
        }
        h3 { margin: 0 0 0.25rem; font: 700 1.35rem/1.2 "Bricolage Grotesque", sans-serif; }
        .hint { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.95rem; }
        form { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        input[type="text"] {
            flex: 1 1 12rem;
            min-width: 0;
            padding: 0.8rem 1rem;
            font: inherit;
            color: var(--ink);
            background: var(--bg);
            border: 1.5px solid var(--line);
            border-radius: 0.375rem;
        }
        input[type="text"]::placeholder { color: var(--muted); }
        input[type="button"] {
            padding: 0.8rem 1.4rem;
            font: 500 1rem "IBM Plex Sans", sans-serif;
            color: var(--accent-ink);
            background: var(--accent);
            border: 0;
            border-radius: 0.375rem;
            cursor: pointer;
        }
        input[type="button"]:hover { filter: brightness(1.1); }
        input:focus-visible, .chip:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
        .chips { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; align-items: center; }
        .chips span { color: var(--muted); font-size: 0.9rem; margin-right: 0.25rem; }
        .chip {
            min-width: 2.5rem;
            padding: 0.3rem 0.7rem;
            font: 700 0.95rem "Bricolage Grotesque", sans-serif;
            color: var(--ink);
            background: transparent;
            border: 1.5px solid var(--line);
            border-radius: 0.375rem;
            cursor: pointer;
        }
        .chip:hover { border-color: var(--accent); color: var(--accent); }

        /* Results written by main.py */
        #output {
            margin-top: 1.5rem;
            padding: 1.25rem 0 0 1rem;
            border-top: 1px solid var(--line);
            border-left: 5px solid var(--tile);
            border-top-left-radius: 0;
            line-height: 1.9;
            min-height: 4rem;
        }
        #output b { display: inline-block; min-width: 9.5rem; color: var(--muted); font-weight: 500; }
        #output:empty { border-left-color: transparent; padding-left: 0; }
        #output:empty::before {
            content: "Results appear here. Pick a symbol above to start.";
            color: var(--muted);
        }
        @media (max-width: 30rem) {
            header { flex-direction: column; align-items: flex-start; }
            #output b { display: block; min-width: 0; line-height: 1.4; margin-top: 0.4rem; }
        }
    </style>
</head>
<body>
<main>
   <header>
       <div class="tile" aria-hidden="true">
           <span class="num">?</span>
           <span class="sym">Nm</span>
           <span class="name">Non-metal</span>
       </div>
       <div>
           <h1>Non-Metal Elements</h1>
           <p>Periodic Table Information Finder</p>
       </div>
   </header>

   <section class="panel">
       <h3>Search</h3>
       <p class="hint">Instructions: Enter a symbol using non-metal elements. (E.g.: H, O, Cl, Ne, Xe)</p>
       <form onsubmit="return false;">
           <input type="text" id="element" placeholder="Enter a non-metal symbol" aria-label="Element symbol" autocomplete="off" required>
           <input type="button" py-click="Search" value="Search Element">
       </form>
       <div class="chips">
           <span>Try:</span>
           <button type="button" class="chip">H</button>
           <button type="button" class="chip">O</button>
           <button type="button" class="chip">Cl</button>
           <button type="button" class="chip">Ne</button>
           <button type="button" class="chip">Xe</button>
       </div>
       <!-- Search results appear here -->
       <div id="output" aria-live="polite"></div>
   </section>
</main>

<script>
    document.querySelectorAll('.chip').forEach(function (chip) {
        chip.addEventListener('click', function () {
            var input = document.getElementById('element');
            input.value = chip.textContent;
            input.focus();
        });
    });
</script>
<script type="py" src="main.py"></script>
</body>
</html>
